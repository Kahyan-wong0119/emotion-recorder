<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jom Kenali Emosi! Recorder</title>
<style>
body{font-family:Arial,sans-serif;max-width:560px;margin:24px auto;padding:18px;color:#243047;background:#f7fbff;line-height:1.5}
main{background:white;border:1px solid #d8e1ee;border-radius:16px;padding:20px}
button{border:0;border-radius:10px;padding:12px 16px;margin:5px 5px 5px 0;background:#5576d9;color:white;font-size:16px;cursor:pointer}
button.secondary{background:#e9eefb;color:#2f447d}button:disabled{opacity:.5;cursor:not-allowed}
.notice{padding:10px;border-radius:8px;background:#fff8dc;white-space:pre-wrap}audio{width:100%;margin:12px 0}
</style>
</head>
<body><main>
<h1>🎙️ Jom Kenali Emosi!</h1>
<p>Record up to 60 seconds. Review your recording, then send it back to the teacher page.</p>
<button id="startBtn">● Start recording</button>
<button id="stopBtn" class="secondary" disabled>■ Stop</button>
<p id="status" class="notice">Ready to record.</p>
<audio id="preview" controls hidden></audio><br>
<button id="sendBtn" disabled>Send recording back</button>
</main>
<script>
const params = new URLSearchParams(location.search);
const parentOrigin = params.get('parentOrigin');
const allowedParent = parentOrigin && /^https:\/\/(script\.google\.com|(?:[a-z0-9-]+\.)*script\.googleusercontent\.com)$/.test(parentOrigin);
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const sendBtn = document.getElementById('sendBtn');
const statusEl = document.getElementById('status');
const preview = document.getElementById('preview');
let stream = null, recorder = null, chunks = [], blob = null, startedAt = 0, duration = 0, stopTimer = null;
function status(text){statusEl.textContent=text;}
function stopTracks(){if(stream) stream.getTracks().forEach(t=>t.stop()); stream=null;}
startBtn.addEventListener('click', async () => {
  if (!allowedParent || !window.opener) { status('Cannot connect to the teacher page. Open this page using the Start recording button inside the Apps Script app.'); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[]; blob=null; duration=0;
    const opts = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? {mimeType:'audio/webm;codecs=opus'} : {};
    recorder = new MediaRecorder(stream, opts);
    recorder.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
      blob = new Blob(chunks,{type:recorder.mimeType || 'audio/webm'});
      duration = Math.min(60,Math.max(1,Math.round((Date.now()-startedAt)/1000)));
      preview.src = URL.createObjectURL(blob); preview.hidden=false;
      sendBtn.disabled = !blob.size || blob.size > 8*1024*1024;
      startBtn.disabled=false; stopBtn.disabled=true; stopTracks();
      status(blob.size > 8*1024*1024 ? 'Recording is over 8 MB. Please record a shorter clip.' : `Recording complete (${duration} seconds). Listen before sending it back.`);
    };
    recorder.start(); startedAt=Date.now(); startBtn.disabled=true; stopBtn.disabled=false; sendBtn.disabled=true;
    status('Recording… maximum 60 seconds.');
    stopTimer=setTimeout(()=>{if(recorder && recorder.state==='recording') recorder.stop();},60000);
  } catch(e) { status('Microphone error: '+(e.message || e.name || e)); startBtn.disabled=false; stopBtn.disabled=true; }
});
stopBtn.addEventListener('click',()=>{if(stopTimer)clearTimeout(stopTimer);if(recorder && recorder.state==='recording')recorder.stop();});
sendBtn.addEventListener('click',()=>{
  if(!blob || !window.opener || !allowedParent)return;
  if(blob.size>8*1024*1024){status('Recording is over 8 MB. Please record again.');return;}
  sendBtn.disabled=true; status('Preparing recording…');
  const reader=new FileReader();
  reader.onloadend=()=>{
    try {
      window.opener.postMessage({type:'JKE_AUDIO_READY',dataUrl:reader.result,durationSeconds:duration},parentOrigin);
      status('Recording sent to the teacher page. Return to that page and click Submit recording to save it to Google Drive.');
    } catch(e) { status('Could not send recording: '+(e.message||e)); sendBtn.disabled=false; }
  };
  reader.onerror=()=>{status('Could not read the recording. Please try again.');sendBtn.disabled=false;};
  reader.readAsDataURL(blob);
});
window.addEventListener('beforeunload',stopTracks);
</script></body></html>
